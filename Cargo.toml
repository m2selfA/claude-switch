[package]
name = "cswitch"
version = "0.7.1"
edition = "2024"
description = "Multi-account profile manager for Claude Code"
license = "MIT"
repository = "https://github.com/m2selfA/claude-switch"
homepage = "https://github.com/m2selfA/claude-switch"
readme = "README.md"
keywords = ["claude", "cli", "profile", "manager", "claude-code"]
categories = ["command-line-utilities"]
authors = ["Abhishek21k"]

[[bin]]
name = "cswitch"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
base64 = "0.22"
arboard = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"
